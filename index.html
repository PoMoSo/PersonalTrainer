/* VOICE: a training logbook, plain and quick to fill in mid-set
   IDEA: the clipboard log sheet hanging in a home gym
   PICTURE: the working week strip and the exercise sheet itself
   COLOUR and TYPE: iron-plate red band, paper white sheet, ink; Barlow Condensed + Barlow

:root{color-scheme:light dark;--bg:light-dark(#f3f1ed,#141619);--ink:light-dark(#16181b,#ecebe7);--card:light-dark(#ffffff,#1d2024);--line:light-dark(#dfdbd3,#33373d);--mute:light-dark(#68655f,#9c9a95);--red:light-dark(#b8261f,#a3221c);--redk:light-dark(#8f1a14,#7c1813);--field:light-dark(#faf9f7,#24282d);--ok:light-dark(#1f6f43,#5cc28a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(4vw,14px)}
.wrap{max-width:1000px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f5b400;outline-offset:2px}
.top{background:var(--red);color:#fff;padding-bottom:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,44px);letter-spacing:.01em}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.wk{display:flex;align-items:center;gap:4px;background:var(--redk);border-radius:10px;padding:3px}
.wk span{min-width:132px;text-align:center;font-weight:600;white-space:nowrap;display:grid;line-height:1.15}.wk small{opacity:.8;font-size:13px;font-weight:500}
.tbtn{min-height:46px;padding:0 14px;border:0;border-radius:10px;background:var(--redk);color:#fff;font-weight:600}
.days i{font-style:normal;opacity:.75}.days button.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.wk button,.unit button{min-width:44px;min-height:40px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:20px}
.wk button:disabled{opacity:.35;cursor:default}
.unit{display:flex;background:var(--redk);border-radius:10px;padding:3px}
.unit button{font-size:15px;font-weight:600}
.unit button[aria-pressed=true]{background:#fff;color:var(--red)}
.save{min-height:46px;padding:0 20px;border:0;border-radius:10px;background:#fff;color:var(--red);font-weight:700}
.save:disabled{opacity:.55;cursor:default}
.st{font-size:14px;opacity:.9;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:22px}
.days button{border:0;border-radius:12px 12px 0 0;background:var(--redk);color:#fff;text-align:start;padding:10px 10px 12px;min-height:72px;display:flex;flex-direction:column;gap:2px;position:relative}
.days b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.days span{font-size:13px;line-height:1.25;opacity:.85}
.days button[aria-current=true]{background:var(--bg);color:var(--ink)}
.days button.done::after{content:"";position:absolute;top:12px;right:10px;width:10px;height:10px;border-radius:50%;background:#f5b400}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;color:#16181b;border-radius:10px;padding:10px 14px;margin-top:16px;font-size:15px}
.banner button{min-height:40px;border-radius:8px;border:1px solid #16181b;background:transparent;padding:0 14px}
.head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
.kick{margin:0 0 4px;color:var(--mute);font-size:15px}
h2{font-size:clamp(32px,4.5vw,46px)}
.pick{display:grid;gap:4px;flex:1 1 280px;max-width:420px}
.pick span,.note span{font-size:14px;color:var(--mute);font-weight:500}
select,textarea,.set input{background:var(--field);border:1px solid var(--line);border-radius:10px;font-size:16px}
select{min-height:48px;padding:0 12px;width:100%}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;margin-bottom:14px}
.chk input{width:22px;height:22px;accent-color:var(--red)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;justify-items:start}
.empty p{margin:0;color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.wo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,2.4vw,24px);margin-bottom:18px}
h3{font-size:28px}
.meta{margin:4px 0 0;color:var(--mute);font-size:14px}
h4{margin:20px 0 6px;font-size:15px;color:var(--red);font-weight:600}
.ex{list-style:none;margin:0;padding:0}
.ex li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.nm{display:flex;gap:10px;font-weight:500;padding-top:9px}
.nm b{color:var(--mute);font-weight:500;min-width:1.6em;font-variant-numeric:tabular-nums}
.sets{display:grid;gap:6px;justify-items:end}
.set{display:flex;align-items:center;gap:6px}
.sn{font-size:13px;color:var(--mute);width:3.4em;white-space:nowrap}
.set input{width:64px;min-height:42px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--mute);opacity:.6}
.x,.u,.u2{color:var(--mute);font-size:14px}
.set select{width:auto;min-height:42px;padding:0 8px;min-width:120px}
.set{flex-wrap:wrap;justify-content:flex-end}
.grp{border-top:1px solid var(--line);margin-top:6px}.grp summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;min-height:48px;padding:12px 0;cursor:pointer;list-style:none}
.grp summary::-webkit-details-marker{display:none}.grp summary::before{content:"▸";color:var(--red);width:1em}.grp[open] summary::before{content:"▾"}
.grp summary span{font-weight:600;color:var(--red)}.grp summary small{color:var(--mute);font-size:14px}
.addx{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--line)}.addx input{flex:1;min-height:44px;padding:0 12px;background:var(--field);border:1px dashed var(--line);border-radius:10px;font-size:16px}.addx .btn{flex:none}.u{width:1.4em}
.sb{display:flex;gap:6px}
.sb button{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--mute)}
.rest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--mute)}
.note{display:grid;gap:4px;margin:6px 0 16px}
textarea{width:100%;padding:10px 12px;resize:vertical}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.btn.warn{color:var(--red)}
.views{display:flex;background:var(--redk);border-radius:10px;padding:3px}
.views button{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#fff;font-weight:600}
.views button[aria-pressed=true]{background:#fff;color:var(--red)}
.top.flat{padding-bottom:clamp(18px,3vw,36px)}
.mnav,.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;align-content:start}
.tile span{font-size:14px;color:var(--mute)}.tile b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(26px,4vw,34px);line-height:1.1;overflow-wrap:anywhere}.tile small{font-size:13px;color:var(--mute)}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:10px}
.ch{font-size:13px;color:var(--mute);padding:0 4px}
.wkc{display:grid;align-content:center;justify-items:center;font-size:13px;color:var(--mute)}.wkc b{font-size:15px;color:var(--ink)}
.cell{min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:start;padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell .dn{font-weight:600;font-variant-numeric:tabular-nums}
.cell .wn{font-size:12.5px;line-height:1.2;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell.out{opacity:.45}
.cell.plan{border:1.5px dashed var(--red)}
.cell.done{background:var(--red);border-color:var(--red);color:#fff}.cell.done .wn{color:#fff;opacity:.9}
.cell.today .dn{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,2.4vw,24px);margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin-bottom:6px}
.fig{position:relative;height:260px;margin-top:10px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-y}
.gl{stroke:var(--line);stroke-width:1}.gl.base{stroke:var(--mute);opacity:.6}
.ax{fill:var(--mute);font-size:12px;font-family:Barlow,sans-serif}
.bar{fill:var(--red)}.bar.on{fill:var(--redk)}
.ln{fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

.xh{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:2}
.hb{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.hb i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--red);min-width:3px}.hb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:10px;font-size:14px}summary{cursor:pointer;color:var(--mute);min-height:32px}
table{border-collapse:collapse;width:100%;margin-top:6px}td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}.n{text-align:right;font-variant-numeric:tabular-nums}
.chg{font-size:15px;margin:4px 0 0;color:var(--mute)}.chg b{font-family:"Barlow Condensed",sans-serif;font-size:24px;color:var(--ink)}

.chks{display:flex;flex-wrap:wrap;gap:0 24px}
@media(max-width:600px){.cal{grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px}.cell{min-height:50px;padding:4px;align-items:center}.cell .wn{display:none}.wkc span{display:none}.wkc b{font-size:12px}.fig{height:220px}.hb{grid-template-columns:minmax(0,8em) minmax(0,1fr) 2em}}

.fld{display:grid;gap:4px;margin-bottom:10px}.fld span{font-size:14px;color:var(--mute);font-weight:500}

@media(prefers-reduced-motion:no-preference){.days button,.save{transition:background .15s,color .15s}}

  else if(a==='wnew'){edit={id:null,n:'',s:'',sets:2,abs:false,kind:'strength',text:'',focus:true};renderAll()}
  else if(a==='wfrom'){const w=byId[$('wcopy').value];edit={id:null,n:w.n+' (my version)',s:'',sets:w.sets,abs:!!w.abs,kind:w.kind||'strength',text:wText(w),focus:true};renderAll()}
  else if(a==='wreset'){const id=b.dataset.id;if(armedRm!=='reset-'+id){armedRm='reset-'+id;renderAll();setTimeout(()=>{if(armedRm==='reset-'+id){armedRm='';if(view==='settings')renderAll()}},4000)}else{armedRm='';delete S.overrides[id];if(edit&&edit.id===id)edit=null;rebuild();touch();renderAll()}}
  else if(a==='wedit'){const w=byId[b.dataset.id];edit={builtin:!w.custom,orig:w.n,id:w.id,n:w.n,s:w.s===w.n?'':w.s,sets:w.sets,abs:!!w.abs,kind:w.kind||'strength',text:wText(w),focus:true};renderAll()}
  else if(a==='wcancel'){edit=null;renderAll()}
  else if(a==='wsave')saveWorkout();
  else if(a==='wrm'){const id=b.dataset.id;if(armedRm!==id){armedRm=id;renderAll();setTimeout(()=>{if(armedRm===id){armedRm='';if(view==='settings')renderAll()}},4000)}else{armedRm='';const w=S.custom.find(x=>x.id===id);if(w)w.hidden=true;if(edit&&edit.id===id)edit=null;rebuild();touch();renderAll()}}
  else if(a==='sycopy'){const o=$('sy-out');const c=syncCode;const done=()=>{syncMsg='Code copied. Paste it in Settings on your other device.';const m=$('sy-msg');if(m)m.textContent=syncMsg};
    if(!c)return;try{navigator.clipboard.writeText(c).then(done,()=>{o.focus();o.select();syncMsg='Your browser blocked copying. The code is selected: copy it yourself.';$('sy-msg').textContent=syncMsg})}catch(e){o.focus();o.select()}}
  else if(a==='symerge')importCode(false);
  else if(a==='syrep'){if(!armedRep){armedRep=true;renderAll();setTimeout(()=>{if(armedRep){armedRep=false;if(view==='settings')renderAll()}},4000)}else importCode(true)}
  else if(a==='pm'||a==='nm'){const dt=new Date(ov.y,ov.m+(a==='pm'?-1:1),1);ov={y:dt.getFullYear(),m:dt.getMonth()};renderAll()}
  else if(a==='thism'){ov={y:today.getFullYear(),m:today.getMonth()};renderAll()}
  else if(a==='range'||a==='metric'){sx[a]=b.dataset.v;store.set('mpt-stats',sx);renderAll()}
  else if(a==='pw')setView(wkKey(addDays(curMon(),-7)),cur.d);
  else if(a==='nw')setView(wkKey(addDays(curMon(),7)),cur.d);
  else if(a==='today'){const t=todayView();setView(t.k,t.d)}
  else if(a==='unit'){if(S.unit!==b.dataset.u){S.unit=b.dataset.u;touch();renderAll()}}
  else if(a==='save')save();
  else if(a==='add'){padTo(b.dataset.k,+b.dataset.n).push({r:'',k:''});touch();renderPanel()}
  else if(a==='rm'){const arr=padTo(b.dataset.k,+b.dataset.n);if(arr.length>1)arr.pop();touch();renderAll()}
  else if(a==='fill'){CLASSIC[b.dataset.p].forEach((id,d)=>{const dy=day(cur.k,d,true);if(!dy.wo){dy.wo=id;dy.abs=!!byId[id].abs}});touch();renderAll()}
  else if(a==='clear'){if(!armed){armed=true;renderPanel();setTimeout(()=>{if(armed){armed=false;renderPanel()}},4000)}else{armed=false;if(S.log[cur.k])delete S.log[cur.k][cur.d];touch();renderAll()}}
  else if(a==='restore'){S=pending;S.log=S.log||{};S.unit=S.unit||'kg';S.custom=S.custom||[];S.overrides=S.overrides||{};rebuild();pending=null;touch();renderAll()}
  else if(a==='discard'){pending=null;store.set(KEY,{basedOn:BASE,dirty:false,data:S});renderTop()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.gk)openG[d.dataset.gk]=d.open},true);
document.addEventListener('submit',e=>{const f=e.target.closest&&e.target.closest('.addx');if(!f)return;e.preventDefault();const inp=f.querySelector('input'),n=inp.value.trim().replace(/\s+/g,' ');if(n)addExercise(f.dataset.wo,+f.dataset.g,n,inp)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('hashchange',()=>{if(readHash())renderAll()});
window.addEventListener('beforeunload',e=>{if(dirty&&mode==='shared'){e.preventDefault();e.returnValue=''}});

function buildDoc(st){
  const json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head>'+HEAD+'<style id="css">'+$('css').textContent+'</style></head><body>'+SHELL+'<script type="application/json" id="state">'+json+'<\/script><script id="app">'+$('app').textContent+'<\/script></body></html>';
}
async function save(){
  if(mode!=='shared'||!art||!dirty)return;
  const st=JSON.parse(JSON.stringify(S));st.savedAt=Date.now();
  store.set(KEY,{basedOn:st.savedAt,pending:true,data:st});
  statusMsg='Saving…';renderStatus();$('save').disabled=true;
  try{await art.publish(buildDoc(st));dirty=false;statusMsg='Saved';renderStatus()}
  catch(err){
    store.set(KEY,{basedOn:BASE,dirty:true,data:S});
    const c=String((err&&(err.code||err.name||err.message))||'');
    if(/conflict/i.test(c))statusMsg='Saved from another device first. Reloading…';
    else if(/not_granted|not_writer/i.test(c)){mode='readonly';statusMsg=''}
    else statusMsg='Couldn’t save. Try again.';
    renderStatus();
  }
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{});
renderAll();
if(draft&&draft.basedOn===BASE&&draft.pending&&!draft.dirty)store.set(KEY,{basedOn:BASE,dirty:false,data:S});
(async()=>{try{art=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null}catch(e){art=null}
  mode=art?'shared':'local';renderStatus()})();
}</script></body></html>
