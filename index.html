<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLX Trainer</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d0f11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BLX Trainer"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">/* VOICE: garage-gym training board: blunt, fast, built for sweaty thumbs
   IDEA: the steel scoreboard bolted to the gym wall
   PICTURE: the week strip and the big workout cards, then one exercise card per move
   COLOUR and TYPE: carbon and steel greys, one iron-red accent; Big Shoulders Display + Barlow
   LAYOUT: side rail (bottom bar on phones), sticky week header, card grid, one column per workout */
:root{color-scheme:dark;--bg:light-dark(#e6e7e9,#0d0f11);--s1:light-dark(#ffffff,#16191d);--s2:light-dark(#f1f2f4,#1d2126);--s3:light-dark(#e1e3e7,#2a2f36);--line:light-dark(#d0d3d8,#2b3036);--ink:light-dark(#111316,#f2f2ef);--mute:light-dark(#5a6169,#8f969f);--acc:light-dark(#cc271c,#ee3a2c);--acc2:light-dark(#9f1d14,#b92a1f);--on:#fff;--r:8px;--f:"Barlow",system-ui,-apple-system,sans-serif;--h:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
#root{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--s1);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:26px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font:800 32px/.88 var(--h);text-transform:uppercase;padding:0 6px}
.brand i{display:block;font-style:normal;color:var(--acc);font-size:22px}
.logo,.mlogo{display:block;border-radius:12px;background:#111418;flex:none}.logo{width:64px;height:64px}.mlogo{display:none;width:40px;height:40px;border-radius:9px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:var(--mute);font-weight:600;font-size:16px;text-align:start}
.nav button:hover{color:var(--ink)}
.nav svg{width:24px;height:24px;flex:none}
.nav button[aria-current=page]{background:var(--s3);color:var(--ink)}.nav button[aria-current=page] svg{color:var(--acc)}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px clamp(14px,3vw,36px)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;max-width:1080px}
.ttl{font:800 30px/1 var(--h);text-transform:uppercase}
.wknav{display:flex;align-items:center;gap:6px}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);display:grid;place-items:center;font-size:22px;line-height:1;padding:0}
.icon:hover{border-color:var(--acc)}
.wkt{padding:0 8px;display:grid;line-height:1.1;min-width:120px;text-align:center}.wkt b{font:800 26px/1 var(--h);text-transform:uppercase}.wkt small{color:var(--mute);font-size:13px;white-space:nowrap}
.tr{display:flex;align-items:center;gap:12px}
.st{font-size:14px;color:var(--mute);white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px;max-width:1080px}
.strip button{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:8px 2px 9px;display:grid;justify-items:center;gap:3px;min-height:78px}
.strip button:hover{border-color:var(--acc)}
.dw{font-size:13px;font-weight:600;color:var(--mute)}
.dd{font:800 28px/1 var(--h)}
.pips{display:flex;gap:4px;height:8px}
.pip{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute)}.pip.on{background:var(--acc);border-color:var(--acc)}
.strip .today .dd{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--acc)}
.strip button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.strip button[aria-current=true] .dw{color:var(--on);opacity:.85}.strip button[aria-current=true] .pip{border-color:var(--on)}.strip button[aria-current=true] .pip.on{background:var(--on)}.strip button[aria-current=true].today .dd{text-decoration-color:var(--on)}
#panel{padding:clamp(18px,3vw,36px) clamp(14px,3vw,36px) 120px;max-width:1152px;width:100%}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--acc);border-radius:var(--r);padding:10px 14px;margin-top:12px;font-size:15px;max-width:1080px}
.btn{min-height:46px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}.btn.pri:hover{background:var(--acc2)}
.btn.ghost{background:transparent}.btn.sm{min-height:44px;padding:0 14px}.btn.big{min-height:58px;font-size:18px;padding:0 28px}
.btn.warn{color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.ph{margin-bottom:20px}
.kick{margin:0 0 4px;color:var(--mute);font-size:15px;font-weight:500}
.ph h1{font:800 clamp(38px,6.5vw,64px)/.92 var(--h);text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--mute);white-space:nowrap}.chip b{color:var(--ink);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));grid-auto-rows:1fr;gap:14px}
.wcard{aspect-ratio:1;border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;overflow:hidden}
.wcard:hover{border-color:var(--acc)}
.tagc{font-size:13px;font-weight:600;color:var(--mute);background:var(--s3);border-radius:999px;padding:2px 10px}
.nm2{font:800 clamp(22px,2.3vw,30px)/.95 var(--h);text-transform:uppercase;overflow-wrap:break-word;hyphens:auto;max-width:100%}
.plus{font-size:14px;font-weight:600;color:var(--acc)}
.sum{font-size:14px;color:var(--mute)}
.foot2{margin-top:auto;display:flex;justify-content:space-between;align-items:center;width:100%}
.state{font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--s3)}
.go{font-size:24px;color:var(--acc);line-height:1}
.wcard.done{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--acc) 24%,var(--s1)),var(--s1) 65%)}
.wcard.done .state{background:var(--acc);color:var(--on)}
.addcard{border:2px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--mute);font-weight:700;font-size:17px}
.addcard:hover{color:var(--ink)}
.plusbig{font:800 64px/1 var(--h);color:var(--acc)}
.empty{background:var(--s1);border:2px dashed var(--line);border-radius:14px;padding:clamp(24px,5vw,48px);display:grid;justify-items:center;gap:12px;text-align:center}
.empty>p{margin:0;color:var(--mute)}
.plan{width:100%;max-width:620px;text-align:start;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.plan summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--mute)}
.plan .meta{margin:10px 0 0}
.back{border:0;background:none;color:var(--mute);font-weight:600;min-height:44px;padding:0;margin-bottom:6px;font-size:16px}.back:hover{color:var(--acc)}
.progw{display:flex;align-items:center;gap:12px;margin:-6px 0 18px;font-size:14px;color:var(--mute)}
.prog{flex:1;max-width:360px;height:8px;background:var(--s3);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:999px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-bottom:8px}
.tog{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);font-weight:600;cursor:pointer}
.tog span{display:grid;line-height:1.25}.tog small{font-weight:400;color:var(--mute);font-size:13px}
.tog input{appearance:none;-webkit-appearance:none;margin:0;width:48px;height:28px;border-radius:999px;background:var(--s3);position:relative;flex:none;cursor:pointer}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tog input:checked{background:var(--acc)}.tog input:checked::after{left:23px}
.tog input:disabled{cursor:default}
.fld{display:grid;gap:4px;margin-bottom:10px}.fld>span{font-size:14px;color:var(--mute);font-weight:600}
.ctrl .fld{margin:0;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
select,.fld input,textarea,#pq{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);font-size:16px;width:100%}
select{min-height:46px;padding:0 10px}
.fld input,#pq{min-height:48px;padding:0 14px}
textarea{padding:12px 14px;resize:vertical}
.blk{margin-top:28px}
.blkh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.blkh h2{font:800 32px/1 var(--h);text-transform:uppercase}
.meta{margin:0;color:var(--mute);font-size:14px}
.ex{list-style:none;padding:0;margin:0 0 4px;display:grid;gap:10px}
.ex li{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ex li.has{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.exh{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.no{font:800 22px/1 var(--h);color:var(--acc);min-width:1.5em}
.nmx{font-weight:700;font-size:18px;flex:1 1 200px}
.last{font-size:14px;color:var(--mute);white-space:nowrap}
.sets{margin-top:12px;display:grid;gap:6px;max-width:520px}
.sethd,.set{display:grid;grid-template-columns:36px repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.sets.c3{max-width:640px}.sets.c3 .sethd,.sets.c3 .set{grid-template-columns:36px repeat(3,minmax(0,1fr))}
.sethd span{font-size:13px;color:var(--mute);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .sn{font:800 20px/1 var(--h);color:var(--mute);text-align:center}
.set input,.set select{width:100%;min-height:50px;border-radius:var(--r);border:1px solid var(--line);background:var(--s2);font-size:19px;font-weight:700;text-align:center;padding:0 6px;font-variant-numeric:tabular-nums}
.set select{font-size:17px;text-align-last:center}
.set input::placeholder{color:var(--mute);opacity:.55;font-weight:500}
.set input:not(:placeholder-shown){border-color:var(--acc)}
.setbtns{display:flex;gap:8px;margin-top:10px}
.setbtns button{min-height:40px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--mute);font-weight:600;font-size:14px}
.setbtns button:hover{color:var(--ink);border-color:var(--acc)}
.grp{margin-top:10px}
.grp summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-height:54px;padding:8px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:"+";font:800 22px/1 var(--h);color:var(--acc);width:1em}.grp[open] summary::before{content:"−"}
.grp summary span{font-weight:700}.grp summary small{color:var(--mute);font-size:14px}
.grp[open] summary{margin-bottom:10px;border-color:var(--acc)}
.grp h4,.blk h4{margin:18px 0 8px;font-size:15px;color:var(--mute);font-weight:600}
.addx{display:flex;gap:8px;margin:10px 0 6px}
.addx input{flex:1;min-height:48px;padding:0 14px;background:transparent;border:2px dashed var(--line);border-radius:var(--r);font-size:16px}
.addx .btn{flex:none}
.note{display:grid;gap:6px;margin:26px 0 16px}.note span{font-size:14px;color:var(--mute);font-weight:600}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.rest{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--mute);margin-top:10px}
.head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
.head h2{font:800 clamp(38px,6.5vw,64px)/.92 var(--h);text-transform:uppercase}
.mnav,.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;align-content:start}
.tile span{font-size:14px;color:var(--mute);font-weight:600}.tile b{font:800 clamp(32px,4.5vw,42px)/1 var(--h);overflow-wrap:anywhere}.tile small{font-size:13px;color:var(--mute)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px clamp(14px,2.4vw,26px);margin-bottom:16px}
.card h3{font:800 28px/1 var(--h);text-transform:uppercase;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin:14px 0 6px}
.exsel{display:grid;gap:4px;flex:1 1 240px;max-width:380px}.exsel span{font-size:14px;color:var(--mute);font-weight:600}
.chg{font-size:15px;margin:8px 0 0;color:var(--mute)}.chg b{font:800 30px/1 var(--h);color:var(--ink)}
.fig{position:relative;height:270px;margin-top:12px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-y}
.gl{stroke:var(--line);stroke-width:1}.gl.base{stroke:var(--mute);opacity:.6}
.ax{fill:var(--mute);font-size:12px;font-family:var(--f)}
.bar{fill:var(--acc)}.bar.on{fill:var(--acc2)}
.ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--acc);stroke:var(--s1);stroke-width:2}
.xh{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:2}
.hb{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hb i{display:block;height:16px;border-radius:0 4px 4px 0;background:var(--acc);min-width:3px}.hb em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
details.tbl,.card details{margin-top:12px;font-size:14px}.card details summary{cursor:pointer;color:var(--mute);min-height:36px;font-weight:600}
table{border-collapse:collapse;width:100%;margin-top:6px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}.n{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}
.ch{font-size:13px;color:var(--mute);font-weight:600;padding:0 6px}
.wkc{display:grid;align-content:center;justify-items:center;font-size:13px;color:var(--mute)}.wkc b{font:800 18px/1 var(--h);color:var(--ink)}
.cell{min-height:92px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);text-align:start;padding:7px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cell:hover{border-color:var(--acc)}
.cell .dn{font:800 20px/1 var(--h)}
.cell .wn{font-size:12.5px;line-height:1.2;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.cell.plan{border:1.5px dashed var(--acc)}

.cell.today .dn{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 6px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;margin-bottom:10px}

.sb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.err{color:var(--acc);font-weight:700;margin:4px 0}.err:empty,.msg:empty{display:none}.msg{margin:10px 0 0;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));max-height:min(84vh,780px);background:var(--s1);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.shd h2{font:800 34px/1 var(--h);text-transform:uppercase}
.plist{overflow:auto;margin-top:6px;padding-bottom:6px;overscroll-behavior:contain}

.pk:hover{border-color:var(--acc);background:var(--s3)}
.hero{display:flex;align-items:center;gap:clamp(14px,3vw,26px);margin-bottom:22px}
.hlogo{width:clamp(84px,14vw,128px);height:clamp(84px,14vw,128px);border-radius:18px;background:#111418;flex:none;display:block}
.hero h1{font:800 clamp(48px,9vw,92px)/.85 var(--h);text-transform:uppercase}.hero h1 span{color:var(--acc)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:16px}.hgrid .card{margin:0}
.row0{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}

const logo=cls=>`<img class="${cls}" src="${LOGO}" alt="" width="72" height="72">`;
function renderNav(){$('nav').innerHTML=`<div class="brand">${logo('logo')}<span>BLX<i>Trainer</i></span></div><nav class="nav" aria-label="Sections">${[['home','Home'],['log','Log'],['overview','Calendar'],['stats','Stats'],['library','Library'],['diary','Diary'],['settings','Settings']].map(([v,l])=>`<button data-act="view" data-v="${v}"${view===v?' aria-current="page"':''}>${ICON[v]}<span>${l}</span></button>`).join('')}</nav>`}
function renderTop(){
  const ban=pending?`<div class="banner"><span>This browser has changes that weren't saved.</span><button class="btn sm" data-act="restore">Restore them</button><button class="btn sm ghost" data-act="discard">Discard</button></div>`:'';
  const right=`<div class="tr"><span class="st" id="status" role="status"></span><button class="btn pri save" id="save" data-act="save" hidden>Save</button></div>`;
  let left,strip='';
  if(view==='log'){const mon=curMon(),iw=isoWeek(mon),tv=todayView(),sh={day:'numeric',month:'short'};
    left=`<div class="wknav"><button class="icon" data-act="pw" aria-label="Previous week">‹</button><div class="wkt"><b>Week ${iw.w}</b><small>${fmt(mon,sh)} – ${fmt(addDays(mon,6),sh)}</small></div><button class="icon" data-act="nw" aria-label="Next week">›</button>${cur.k===tv.k&&cur.d===tv.d&&!cur.s?'':'<button class="btn sm ghost" data-act="today">Today</button>'}</div>`;
    strip=`<nav class="strip" aria-label="Days of week ${iw.w}">${DAYS.map((n,d)=>{const ss=sessions(cur.k,d),dt=addDays(mon,d),act=ss.filter(x=>x.wo!=='rest'),pp=planned(cur.k,d);
      return `<button data-act="day" data-d="${d}" aria-current="${d===cur.d}" class="${sameDay(dt,today)?'today':''}" aria-label="${n} ${fmt(dt,{day:'numeric',month:'long'})}, ${ss.length?ss.length+(ss.length>1?' workouts':' workout'):'nothing logged'}"><span class="dw">${n.slice(0,3)}</span><span class="dd">${dt.getDate()}</span><span class="pips">${[...act.map(x=>isDone(x)),...pp.map(()=>false)].slice(0,4).map(on=>`<i class="pip${on?' on':''}"></i>`).join('')}</span></button>`}).join('')}</nav>`;
  }else left=`<div class="ttl">${{home:'Home',overview:'Calendar',stats:'Stats',library:'Exercise library',diary:'Diary',settings:'Settings'}[view]}</div>`;
  $('top').innerHTML=`<div class="toprow">${view==='home'?'':logo('mlogo')}${left}${right}</div>${strip}${ban}`;
  renderStatus();
}
const spU=()=>S.unit==='lb'?'mph':'km/h';

function saveWorkout(){
  const n=$('fw-n').value.trim(),sh=$('fw-s').value.trim(),sets=+$('fw-sets').value||1,abs=$('fw-abs').checked,kind=$('fw-kind').value,lines=$('fw-ex').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const err=m=>{$('fw-err').textContent=m};
  if(!n)return err('Give the workout a name.');
  if(!lines.some(l=>!l.startsWith('#')))return err('Add at least one exercise.');
  const base=edit.builtin?(S.overrides[edit.id]||(()=>{const b=BUILTIN.find(w=>w.id===edit.id);let i=0;return {g:b.g.map(g=>({l:g.l,a:g.a.map(n=>({i:i++,n}))})),next:i}})()):null;
  const old=edit.builtin?base:edit.id?S.custom.find(w=>w.id===edit.id):null;
  const pool={};let next=0;if(old){old.g.forEach(g=>g.a.forEach(x=>{(pool[x.n]=pool[x.n]||[]).push(x.i);next=Math.max(next,x.i+1)}));next=Math.max(next,old.next||0)}
  const g=[];let curG={l:'',a:[]};
  for(const l of lines){if(l.startsWith('#')){if(curG.a.length)g.push(curG);curG={l:l.replace(/^#+\s*/,''),a:[]}}else{const ids=pool[l];curG.a.push({i:ids&&ids.length?ids.shift():next++,n:l})}}
  if(curG.a.length)g.push(curG);
  const obj={n,s:sh||n,sets,abs:abs?1:0,kind,hint:'',g,next};
  if(edit.builtin)S.overrides[edit.id]=obj;else if(old)Object.assign(old,obj);else S.custom.push({id:'c'+Date.now().toString(36),...obj});
  edit=null;rebuild();touch();renderAll();
}
const b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
async function makeCode(){
  const json=JSON.stringify({v:1,unit:S.unit,custom:S.custom,overrides:S.overrides,goals:S.goals,diary:S.diary,routine:S.routine,weeks:S.weeks,rest:S.rest,exmeta:S.exmeta,prog:S.prog,rpe:S.rpe,log:S.log});
  try{if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));return 'MPT1z.'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(e){}
  return 'MPT1j.'+b64(new TextEncoder().encode(json));
}
async function readCode(code){
  const m=/^MPT1([zj])\.([A-Za-z0-9+/=]+)$/.exec(code.replace(/\s+/g,''));if(!m)throw new Error('format');
  const bytes=Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0));
  const json=m[1]==='z'?await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(bytes);
  const d=JSON.parse(json);if(!d||typeof d.log!=='object')throw new Error('format');return d;
}
async function importCode(replace){

  try{const d=await readCode(box.value);let n=0;
    if(replace){S.log=normLog(d.log||{});S.custom=Array.isArray(d.custom)?d.custom:[];S.overrides=d.overrides&&typeof d.overrides==='object'?d.overrides:{};S.goals=Array.isArray(d.goals)?d.goals:[];S.diary=Array.isArray(d.diary)?d.diary:[];if(d.routine&&typeof d.routine==='object')S.routine=d.routine;if(Array.isArray(d.weeks))S.weeks=d.weeks;if(d.exmeta&&typeof d.exmeta==='object')S.exmeta=d.exmeta;if(d.prog)S.prog=d.prog;if(d.rpe!=null)S.rpe=d.rpe;if(d.rest!=null)S.rest=d.rest;S.unit=d.unit||S.unit;n=Object.values(S.log).reduce((a,w)=>a+Object.values(w).reduce((b,dy)=>b+dy.sessions.length,0),0)}
    else{for(const [k,wk] of Object.entries(normLog(d.log||{}))){for(const [dd,dy] of Object.entries(wk)){const loc=dayObj(k,dd,true);for(const x of dy.sessions){const i=loc.sessions.findIndex(y=>y.id===x.id);if(i>=0)loc.sessions[i]=x;else loc.sessions.push(x);n++}}}
      for(const w of (Array.isArray(d.custom)?d.custom:[])){const i=S.custom.findIndex(x=>x.id===w.id);if(i>=0)S.custom[i]=w;else S.custom.push(w)}
      if(d.overrides&&typeof d.overrides==='object')Object.assign(S.overrides,d.overrides);for(const g of (Array.isArray(d.goals)?d.goals:[]))if(!S.goals.some(x=>x.id===g.id))S.goals.push(g);if(d.exmeta&&typeof d.exmeta==='object')S.exmeta=Object.assign(S.exmeta||{},d.exmeta);for(const w of (Array.isArray(d.weeks)?d.weeks:[])){const i=S.weeks.findIndex(x=>x.id===w.id);if(i>=0)S.weeks[i]=w;else S.weeks.push(w)}for(const e of (Array.isArray(d.diary)?d.diary:[])){const i=S.diary.findIndex(x=>x.id===e.id);if(i>=0)S.diary[i]=e;else S.diary.push(e)}}
    rebuild();touch();syncMsg=`Done: ${n} workout${n===1?'':'s'} ${replace?'loaded':'merged'}.${mode==='shared'?' Press Save to keep them.':''}`;

  armedRep=false;renderAll();
}

  else if(a==='restdef'){S.rest=+b.dataset.v;touch();renderAll()}
  else if(a==='undo'){if(undoSnap){S=JSON.parse(undoSnap);undoSnap=null;rebuild();touch();toastEl().hidden=true;renderAll()}}
  else if(a==='stype'){const x=curSess();const k=b.dataset.k,i=+b.dataset.i,row=b.closest('.sets'),n=row?row.querySelectorAll('.set').length:i+1;const st=padTo(k,n)[i];const order=['','w','d','f'];st.t=order[(order.indexOf(st.t||'')+1)%4];if(!st.t)delete st.t;touch();renderPanel()}
  else if(a==='usesug'){const k=b.dataset.k,sg=suggest(k);if(sg){const row=b.closest('li').querySelector('.sets'),n=Math.max(sg.n,row?row.querySelectorAll('.set').length:1);const arr=padTo(k,n);for(let i=0;i<sg.n;i++){const st=arr[i];if(logged(st))continue;if(sg.c){if(sg.d)st.d=sg.d;if(sg.sp)st.sp=sg.sp}else{st.r=String(sg.r);if(sg.k)st.k=sg.k}}touch();renderPanel()}}
  else if(a==='mup'||a==='mdown'){const x=curSess(),k=b.dataset.k;inList(x,k);const L=x.list,i=L.indexOf(k),j=a==='mup'?i-1:i+1;if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];touch();renderPanel()}}
  else if(a==='mpin'){const x=curSess();inList(x,b.dataset.k);touch();renderPanel()}
  else if(a==='mss'){const x=curSess(),k=b.dataset.k;inList(x,k);const L=x.list,i=L.indexOf(k);if(x.ss[k]){const g=x.ss[k];delete x.ss[k];const rest=L.filter(q=>x.ss[q]===g);if(rest.length<2)rest.forEach(q=>delete x.ss[q])}else{const nx=L[i+1];if(!nx){toast('Move another exercise below this one first');return}const g=x.ss[nx]||nextLetter(x.ss);x.ss[k]=g;x.ss[nx]=g}touch();renderPanel()}
  else if(a==='mrem'){const x=curSess(),k=b.dataset.k;undoable('Exercise removed from this workout',()=>{inList(x,k);x.list=x.list.filter(q=>q!==k);delete x.ex[k];if(x.ss&&x.ss[k])delete x.ss[k]})}
  else if(a==='mreset'){const x=curSess();undoable('Original order restored',()=>{delete x.list;delete x.ss})}
  else if(a==='mswap'){exPick={mode:'swap',k:b.dataset.k,m:''};renderSheet()}
  else if(a==='madd'){exPick={mode:'add',k:null,m:''};renderSheet()}
  else if(a==='xmus'){exPick.m=b.dataset.v;renderSheet()}
  else if(a==='lmus'){lib.m=b.dataset.v;renderAll()}
  else if(a==='expick'){const x=curSess(),n=b.dataset.n,key=EXKEY[n];if(!x||!key)return;const mode=exPick.mode,old=exPick.k;ensureList(x);if(x.list.some(q=>KEYNAME[q]===n)){toast(n+' is already in this workout');return}
    if(mode==='swap'){const i=x.list.indexOf(old);if(i>=0)x.list[i]=key;else x.list.push(key);if(x.ss[old]){x.ss[key]=x.ss[old];delete x.ss[old]}}else x.list.push(key);
    exPick=null;touch();renderAll()}
  else if(a==='mtog'){const n=b.dataset.n,m=b.dataset.v;let ms=musclesOf(n).filter(q=>q!=='Other');ms=ms.includes(m)?ms.filter(q=>q!==m):[...ms,m];S.exmeta[n]={...(S.exmeta[n]||{}),m:ms.length?ms:undefined};touch();renderSheet()}
  else if(a==='rpeset'){S.rpe=b.dataset.v==='true';touch();renderAll()}
  else if(a==='xnew'){exForm={orig:null,name:'',kind:'strength',m:lib.m?[lib.m]:[],note:'',wo:''};renderSheet()}
  else if(a==='xedit'){const n=b.dataset.n;exForm={orig:n,name:n,kind:exNames()[n]||'strength',m:musclesOf(n).filter(q=>q!=='Other'),note:S.exmeta?.[n]?.note||'',wo:''};renderSheet()}
  else if(a==='xfkind'){exForm.kind=b.dataset.v;exForm.wo='';renderSheet()}
  else if(a==='xfmus'){const m=b.dataset.v;exForm.m=exForm.m.includes(m)?exForm.m.filter(q=>q!==m):[...exForm.m,m];renderSheet()}
  else if(a==='xfsave')exFormSave();
  else if(a==='xfdel'){const n=exForm.orig;exForm=null;hist=null;undoable(n+' deleted',()=>removeEverywhere(n))}
  else if(a==='pick'){picker=true;renderSheet()}
  else if(a==='pclose')closeSheet();
  else if(a==='addwo'){const x=newSess(b.dataset.id);dayObj(cur.k,cur.d,true).sessions.push(x);picker=false;touch();setView(cur.k,cur.d,x.id)}
  else if(a==='sess')setView(cur.k,cur.d,b.dataset.id);
  else if(a==='back')setView(cur.k,cur.d);
  else if(a==='delsess'){const k=cur.k,d=cur.d,sid=cur.s;undoable('Workout deleted',()=>{const dy=dayObj(k,d);if(dy)dy.sessions=dy.sessions.filter(x=>x.id!==sid);cur={k,d,s:null};const h='#'+k.toLowerCase()+'-'+DS[d];if(location.hash!==h)location.hash=h});window.scrollTo({top:0})}
  else if(a==='restore'){S=pending;S.log=S.log||{};S.unit=S.unit||'kg';S.custom=S.custom||[];S.overrides=S.overrides||{};S.goals=S.goals||[];S.diary=S.diary||[];S.routine=S.routine||{};S.weeks=S.weeks||[];S.exmeta=S.exmeta||{};S.prog=S.prog||{min:8,max:12,inc:''};if(S.rpe==null)S.rpe=true;if(S.rest==null)S.rest=90;normLog(S.log);rebuild();pending=null;touch();renderAll()}
  else if(a==='discard'){pending=null;store.set(KEY,{basedOn:BASE,dirty:false,data:S});renderTop()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.gk)openG[d.dataset.gk]=d.open},true);
document.addEventListener('submit',e=>{const f=e.target.closest&&e.target.closest('.addx');if(!f)return;e.preventDefault();const inp=f.querySelector('input'),n=inp.value.trim().replace(/\s+/g,' ');if(n)addExercise(f.dataset.wo,+f.dataset.g,n,inp)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(picker||hist||summ||exPick||exForm)){closeSheet();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
window.addEventListener('hashchange',()=>{if(readHash())renderAll()});
window.addEventListener('beforeunload',e=>{if(dirty&&mode==='shared'){e.preventDefault();e.returnValue=''}});

function buildDoc(st){
  const json=JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head>'+HEAD+'<style id="css">'+$('css').textContent+'</style></head><body>'+SHELL+'<script type="application/json" id="state">'+json+'<\/script><script id="app">'+$('app').textContent+'<\/script></body></html>';
}
async function save(){
  if(mode!=='shared'||!art||!dirty)return;
  const st=JSON.parse(JSON.stringify(S));st.savedAt=Date.now();
  store.set(KEY,{basedOn:st.savedAt,pending:true,data:st});
  statusMsg='Saving…';renderStatus();$('save').disabled=true;
  try{await art.publish(buildDoc(st));dirty=false;statusMsg='Saved';renderStatus()}
  catch(err){
    store.set(KEY,{basedOn:BASE,dirty:true,data:S});
    const c=String((err&&(err.code||err.name||err.message))||'');
    if(/conflict/i.test(c))statusMsg='Saved from another device first. Reloading…';
    else if(/not_granted|not_writer/i.test(c)){mode='readonly';statusMsg=''}
    else statusMsg='Couldn’t save. Try again.';
    renderStatus();
  }
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{});
renderAll();
if(draft&&draft.basedOn===BASE&&draft.pending&&!draft.dirty)store.set(KEY,{basedOn:BASE,dirty:false,data:S});
(async()=>{try{art=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null}catch(e){art=null}
  mode=art?'shared':'local';renderStatus()})();
}</script></body></html>
